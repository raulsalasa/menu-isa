<style>
@font-face{font-family:Fredoka;src:url(fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
:root{--bg:#fff7ec;--card:#ffffff;--ink:#3b2a20;--soft:#8a7566;--line:#f1e2d2;
--fruta:#ff6b6b;--verdura:#3ec97a;--llena:#ffb020;--snack:#a66cff;--acc:#ff7a2f;--sky:#4aa8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1712;--card:#2b231c;--ink:#fff3e6;--soft:#c9b5a3;--line:#3d3229}}
:root[data-theme="dark"]{--bg:#1d1712;--card:#2b231c;--ink:#fff3e6;--soft:#c9b5a3;--line:#3d3229}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,Arial,sans-serif;user-select:none}
.wrap{max-width:760px;margin:auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{width:56px;height:56px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:28px;cursor:pointer;color:var(--ink);flex:none}
h1{font-size:30px;margin:6px 0;line-height:1.1}
.hello{text-align:center;padding:10px 0 18px}
.hello h1{font-size:40px}.hello p{margin:4px 0;color:var(--soft);font-size:20px}
.home{display:grid;gap:16px}
.bigbtn{display:flex;align-items:center;gap:18px;border:0;border-radius:28px;padding:20px 22px;font:700 30px Fredoka;color:#fff;cursor:pointer;text-align:left;box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .1s}
.bigbtn:active,.card:active,.day:active,.pill:active{transform:translateY(4px) scale(.98)}
.bigbtn .em{font-size:64px;background:rgba(255,255,255,.25);width:96px;height:96px;border-radius:24px;display:grid;place-items:center;flex:none}
.dots{display:flex;gap:10px;justify-content:center;margin:4px 0 14px}
.dot{width:46px;height:46px;border-radius:50%;background:var(--card);border:3px dashed var(--line);display:grid;place-items:center;font-size:24px}
.dot.on{border-style:solid}
.ask{text-align:center;font-size:32px;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:var(--card);border:4px solid transparent;border-radius:26px;padding:14px 8px 12px;text-align:center;cursor:pointer;box-shadow:0 6px 0 var(--line);transition:transform .1s}
.card .em{font-size:68px;line-height:1.1;display:block;height:80px}
.card .em svg{width:74px;height:74px}
.card .nm{font-size:19px;font-weight:600;display:block;margin-top:6px;line-height:1.15}
.card .tg{font-size:14px;color:var(--soft);display:block}
.card.sel{border-color:var(--acc);animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08)}}
.box{background:var(--card);border-radius:32px;padding:20px;text-align:center;box-shadow:0 8px 0 var(--line);margin-top:6px}
.lonchera{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.slot{border-radius:22px;padding:14px 6px;color:#fff;font-size:18px;font-weight:600}
.slot .em{font-size:58px;display:block;height:68px}.slot .em svg{width:62px;height:62px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.pill{border:0;border-radius:999px;padding:16px 26px;font:700 22px Fredoka;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.days{display:grid;gap:12px}
.day{display:flex;align-items:center;gap:14px;border:0;border-radius:24px;padding:12px 16px;background:var(--card);box-shadow:0 6px 0 var(--line);cursor:pointer;text-align:left;font-family:Fredoka;color:var(--ink);transition:transform .1s}
.day .dn{width:64px;height:64px;border-radius:18px;color:#fff;display:grid;place-items:center;font:700 22px Fredoka;flex:none}
.day .em{font-size:48px;width:60px;text-align:center;flex:none}.day .em svg{width:52px;height:52px}
.day .tx{font-size:20px;font-weight:600}.day .tx small{display:block;color:var(--soft);font-weight:500;font-size:16px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.spin{animation:wig .5s}@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.hide{display:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:2px;font-size:26px;line-height:1.1;text-align:center;flex:none;width:68px;color:var(--soft)}
.mini svg{width:26px;height:26px}
.note{background:var(--card);border:3px dashed var(--acc);border-radius:22px;padding:16px 18px;margin-bottom:18px;font-size:18px;line-height:1.35}
.home.lock{opacity:.4}
.parent{margin-top:28px;text-align:center;color:var(--soft);font-size:15px}
.parent button{display:block;margin:0 auto 6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 22px;font:600 17px Fredoka;cursor:pointer}
.pp .lead{font-size:18px;color:var(--soft);margin:0 0 10px;line-height:1.35}
.grp{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:14px;box-shadow:0 5px 0 var(--line)}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gh h2{margin:0;font-size:22px}
.gh button{border:0;background:none;color:var(--acc);font:600 16px Fredoka;cursor:pointer;padding:6px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 14px;font:600 16px Fredoka;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sum{position:sticky;bottom:10px;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:16px;line-height:1.4}
.note .pill{display:block}
.pbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.pbtns button{margin:0!important}
.editbtn{border:0;background:none;color:var(--acc);font:700 20px Fredoka;cursor:pointer;padding:8px 4px}
.gh .plus{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font:700 26px/1 Fredoka;padding:0}
.chip.ed{position:relative;cursor:default;animation:jig .3s infinite alternate;margin:6px 2px 0 6px}
.chip.ed:nth-child(2n){animation-delay:.15s}
@keyframes jig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.chip .x{position:absolute;top:-9px;left:-9px;width:24px;height:24px;border-radius:50%;border:2px solid var(--card);background:#e5484d;color:#fff;font:700 16px/1 Arial;padding:0;cursor:pointer;display:grid;place-items:center}
.addrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.addrow input{flex:1;min-width:140px;border:2px solid var(--acc);border-radius:999px;padding:10px 14px;font:600 16px Fredoka;background:var(--bg);color:var(--ink);outline:none}
.addrow button{border:0;border-radius:999px;padding:10px 16px;font:700 16px Fredoka;cursor:pointer}
.addrow .ok{background:var(--acc);color:#fff}.addrow .cx{background:var(--line);color:var(--ink)}
.wrap{position:relative}
.lockbtn{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);color:var(--soft);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;cursor:pointer;touch-action:none;-webkit-touch-callout:none;padding:0;z-index:2}
.lockbtn>svg.lk{width:22px;height:22px}
.lockbtn .ring{position:absolute;inset:0;width:48px;height:48px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:var(--acc);stroke-width:4;stroke-dasharray:132;stroke-dashoffset:132;stroke-linecap:round}
.lockbtn.hold .ring circle{stroke-dashoffset:0;transition:stroke-dashoffset 3s linear}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--card);color:var(--ink);border-radius:26px;padding:22px 20px;max-width:360px;width:100%;text-align:center}
.mbox h2{margin:0 0 6px;font-size:24px}.mbox p{color:var(--soft);font-size:17px;margin:0 0 12px}
.sumq{font-size:40px;font-weight:700;margin:4px 0 10px}
.sumi{width:120px;text-align:center;font:700 34px Fredoka;border:3px solid var(--acc);border-radius:18px;padding:8px;background:var(--bg);color:var(--ink);outline:none}
.mbox .row{margin-top:16px}.mbox .pill{font-size:19px;padding:13px 22px}
.gray{background:#8f8f8f!important}
.mbox.shake{animation:wig .4s}
.zl{display:grid;gap:12px;margin-bottom:16px}
.zi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;border-radius:22px;padding:16px 18px;background:var(--card);box-shadow:0 5px 0 var(--line);font:600 20px Fredoka;color:var(--ink);cursor:pointer;text-align:left}
.zi small{font-weight:500;font-size:15px;color:var(--soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:18px;padding:8px 6px 10px;font:600 14px/1.15 Fredoka;cursor:pointer;opacity:.55}
.opt .em{display:block;font-size:36px;height:44px;line-height:44px}.opt .em svg{width:38px;height:38px}
.opt.on{opacity:1;border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.cnt{display:inline-block;min-width:28px;padding:2px 8px;border-radius:999px;background:var(--acc);color:#fff;font-size:15px;text-align:center;vertical-align:middle}
.cnt.warn{background:#c2410c}
.day.off{opacity:.45;box-shadow:none}
.star{color:var(--llena);font-size:34px;line-height:1;flex:none}
img.ph{width:1.1em;height:1.1em;object-fit:cover;border-radius:.22em;vertical-align:middle;background:#fff}
.chip .cam{border:0;background:none;color:inherit;opacity:.75;padding:0 0 0 8px;cursor:pointer;vertical-align:middle;height:24px}
.chip .cam svg{width:20px;height:20px;vertical-align:middle}
.chip .cth{width:24px;height:24px;border-radius:7px;object-fit:cover;vertical-align:middle;margin:-4px 6px -4px -4px}
.fprev{width:160px;height:160px;border-radius:24px;object-fit:cover;margin:4px auto 6px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font:600 16px Fredoka;z-index:30;max-width:calc(100% - 32px);text-align:center}
.sheet{background:#fff;color:#222;border-radius:16px;padding:16px;overflow-x:auto}
.sh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #ff7a2f;padding-bottom:6px;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.sh h1{font-size:24px;margin:0}.sh span{color:#666;font-size:15px}
.cal{width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px;font-size:12px}
.cal th,.cal td{border:1px solid #e3e3e3;padding:6px 5px;vertical-align:top;text-align:center;line-height:1.2}
.cal thead th{background:#ff7a2f;color:#fff;font-size:13px}
.cal thead th small{display:block;font-weight:500;opacity:.9}
.cal thead th:first-child{background:#fff;border-color:#fff;width:92px}
.cal .rl{text-align:left;background:#f4f4f4;font-size:13px;width:92px}
.cal .rl.sub{font-weight:500;background:#fafafa}
.cal .gl th{background:#fff;border-left-color:#fff;border-right-color:#fff;padding:8px 0 3px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#ff7a2f}
.cal .na{background:#f7f7f7}
.cal .pe{display:block;font-size:22px;height:26px}.cal .pe svg{width:24px;height:24px}
.cal .vac{color:#bbb}
@media print{
  @page{size:letter landscape;margin:10mm}
  html,body{background:#fff!important}
  .noprint,.confetti{display:none!important}
  .wrap{max-width:none;padding:0}
  .sheet{padding:0;border-radius:0;overflow:visible}
  .cal{min-width:0;font-size:14px}
  .cal th,.cal td{padding:12px 6px}
  .cal .pe{font-size:34px;height:40px}.cal .pe svg{width:36px;height:36px}
  .sh h1{font-size:30px}.sh span{font-size:17px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

// Recorta al centro en cuadrado de 240 px y la guarda como JPEG (unos 10-20 KB).
function subeFoto(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{
    const S=240,c=document.createElement("canvas"),s=Math.min(img.width,img.height);c.width=c.height=S;
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,S,S);
    g.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);URL.revokeObjectURL(url);
    FOTO[FN]=c.toDataURL("image/jpeg",.78);
    try{localStorage.setItem("isaFotos",JSON.stringify(FOTO));toast("Foto guardada")}
    catch(e){toast("No se pudo guardar en este aparato (¿sin espacio?)")}
    redraw();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast("No se pudo abrir esa imagen")};
  img.src=url;
}

function grupos(){return CATS.map(c=>({k:c.k,t:"Lonche: "+c.t.toLowerCase(),l:items(c)})).concat([{k:"des",t:"Desayunos",l:lst("des")},{k:"cena",t:"Cenas de Isa",l:lst("cena")}])}
const premio=x=>x[2]=="de premio";
function guardaSel(){sv("isaSel",SEL)}
// Lo que Isa puede escoger: lo preseleccionado que sí hay; si no queda nada, todo lo que hay.
function paraIsa(k,list){const av=list.filter(ok),s=SEL[k]||[],f=av.filter(x=>s.includes(x[0]));return f.length?f:av}
// Sugiere hasta 5 al azar con lo que hay (sin premios). Si ya hay de 4 a 6 válidas, las respeta.
function sugiere(k,list,nuevas){
  const prev=SEL[k]||[],av=list.filter(x=>ok(x)&&!premio(x)).map(x=>x[0]);
  const keep=nuevas?[]:prev.filter(n=>list.some(x=>x[0]==n&&ok(x)));
  if(!nuevas&&keep.length>=4){SEL[k]=keep.slice(0,6);return}
  const pool=av.filter(n=>!keep.includes(n)).sort(()=>Math.random()-.5);
  if(nuevas)pool.sort((a,b)=>prev.includes(a)-prev.includes(b));
  while(keep.length<5&&pool.length)keep.push(pool.shift());
  SEL[k]=keep;
}
function presel(){
  app.innerHTML=hdr("Opciones de la semana","zona()")+`<div class="pp" id="presel"><p class="lead">La app sugiere de 4 a 6 por grupo con lo que hay. Toquen para quitar o agregar. Isa solo verá las marcadas.</p>
  ${grupos().map(g=>{const av=g.l.filter(ok),s=SEL[g.k]||[],n=av.filter(x=>s.includes(x[0])).length;
    return `<div class="grp" data-k="${g.k}"><div class="gh"><h2>${g.t} <span class="cnt${n<Math.min(4,av.length)||n>6?' warn':''}">${n}</span></h2>${av.length>1?`<button onclick="otrasSug('${g.k}')">Sugerir otras</button>`:''}</div>
    ${av.length?`<div class="opts">${av.map(x=>`<button class="opt${s.includes(x[0])?' on':''}" onclick="togSel('${g.k}','${js(x[0])}')"><span class="em">${x[1]}</span>${esc(x[0])}</button>`).join("")}</div>`
    :'<span style="color:var(--soft)">No hay nada en la despensa para esto.</span>'}</div>`}).join("")}

}
function repSel(){const y=window.scrollY;presel();window.scrollTo(0,y)}
function togSel(k,n){
  const g=grupos().find(x=>x.k==k),av=g.l.filter(ok).map(x=>x[0]),s=(SEL[k]||[]).filter(x=>av.includes(x));
  if(s.includes(n))SEL[k]=s.filter(x=>x!=n);
  else{if(s.length>=6){toast("Máximo 6 por grupo");return}SEL[k]=s.concat(n)}
  guardaSel();repSel();
}

function lunesSemana(){const t=new Date();t.setHours(12);const dw=(t.getDay()+6)%7;if(dw>=5)t.setDate(t.getDate()+7-dw);else t.setDate(t.getDate()-dw);return t}
function imprimir(){
  const m=lunesSemana(),f=new Date(m);f.setDate(m.getDate()+6);
  const rango=m.getMonth()==f.getMonth()?`${m.getDate()} al ${f.getDate()} de ${f.toLocaleDateString("es-MX",{month:"long"})}`:`${m.toLocaleDateString("es-MX",{day:"numeric",month:"long"})} al ${f.toLocaleDateString("es-MX",{day:"numeric",month:"long"})}`;
  const cell=(list,n)=>n?`<span class="pe">${find(list,n)}</span>${esc(n)}`:'<span class="vac">—</span>';
  const fechas=D.map((d,j)=>{const x=new Date(m);x.setDate(m.getDate()+j);return x.getDate()});
  const lon=k=>D.map((d,j)=>j<5?`<td>${cell(items(CATS.find(c=>c.k==k)),(L[d]||{})[k])}</td>`:'<td class="na"></td>').join("");
  app.innerHTML=`<div class="noprint">${hdr("Imprimir calendario","zona()")}<p class="lead" style="color:var(--soft);font-size:17px;margin:0 0 12px">Toquen el botón y en la ventana elijan su impresora, o <b>Guardar como PDF</b>.</p>
  <div class="row" style="justify-content:flex-start;margin:0 0 16px"><button class="pill" style="background:var(--acc)" onclick="window.print()">Imprimir o guardar PDF</button></div></div>
  <div class="sheet"><div class="sh"><h1>Menú de Isa</h1><span>Semana del ${rango}</span></div>
  <table class="cal"><thead><tr><th></th>${D.map((d,j)=>`<th>${d}<small>${fechas[j]}</small></th>`).join("")}</tr></thead><tbody>
  <tr><th class="rl">Desayuno</th>${D.map(d=>`<td>${cell(lst("des"),W.des[d])}</td>`).join("")}</tr>
  <tr class="gl"><th class="rl" colspan="8">Lonche</th></tr>
  ${CATS.map(c=>`<tr><th class="rl sub" style="border-left:5px solid ${c.h}">${c.t}</th>${lon(c.k)}</tr>`).join("")}
  <tr class="gl"><th class="rl" colspan="8"></th></tr>
  <tr><th class="rl">Cena</th>${D.map(d=>`<td>${cell(lst("cena"),W.cena[d])}</td>`).join("")}</tr>
  </tbody></table></div>`;
  window.scrollTo(0,0);
}

/* ---------- Lonches ---------- */
const LD=D.slice(0,5);let cur=0;
function guardaL(){sv("isaLS",L)}
function semL(){
  app.innerHTML=hdr("Mis lonches")+`<div class="days" id="dl">${LD.map((d,j)=>{const x=L[d]||{},full=CATS.every(c=>x[c.k]);
  return `<button class="day" onclick="say('${d}');cur=${j};lonche(0)"><span class="dn" style="background:${DC[j]}">${d.slice(0,2)}</span>
  <span class="tx" style="flex:1">${d}<small>${full?'¡Listo!':'Toca para escoger'}</small></span>
  <span class="mini">${CATS.map(c=>`<span>${x[c.k]?find(items(c),x[c.k]):'·'}</span>`).join("")}</span></button>`}).join("")}</div>
  <div class="row"><button class="pill" style="background:var(--snack)" onclick="sorpSem()">Sorpresa toda la semana</button></div>`;
}
function lonche(s){
  if(s>=CATS.length)return lista();
  const c=CATS[s],d=LD[cur],x=L[d]||(L[d]={}),av=paraIsa(c.k,items(c));
  const dots=CATS.map(y=>`<div class="dot ${x[y.k]?'on':''}" style="border-color:${y.c}">${x[y.k]?find(items(y),x[y.k]):''}</div>`).join("");
  app.innerHTML=hdr(`<span style="color:${DC[cur]}">Lonche del ${d}</span>`,"semL()")+`<div class="dots">${dots}</div><div class="ask" style="color:${c.c}">${c.q}</div>
  ${av.length?`<div class="grid">${av.map(([n,e,t])=>`<div class="card ${x[c.k]==n?'sel':''}" style="${x[c.k]==n?'border-color:'+c.c:''}" onclick="pick(${s},'${js(n)}',this)"><span class="em">${e}</span><span class="nm">${esc(n)}</span>${t?`<span class="tg">${t}</span>`:''}</div>`).join("")}</div>`
  :nada()+`<button class="pill" style="background:${c.c}" onclick="delete L['${d}']['${c.k}'];lonche(${s+1})">Seguir sin ${c.t.toLowerCase()}</button></div>`}`;
  say((s==0?"Lonche del "+d+". ":"")+(av.length?c.q:"No hay "+c.t.toLowerCase()+" en casa"));
}
function pick(s,n,el){L[LD[cur]][CATS[s].k]=n;guardaL();say(n);el.classList.add("sel");el.style.borderColor=CATS[s].c;setTimeout(()=>lonche(s+1),650)}
function lista(){
  const d=LD[cur],x=L[d],sig=LD.findIndex(k=>!CATS.every(c=>(L[k]||{})[c.k]));
  const nx=sig>=0&&sig!=cur?sig:-1;
  app.innerHTML=hdr(`<span style="color:${DC[cur]}">${d}</span>`,"semL()")+`<div class="box"><h1>¡Tu lonche está listo!</h1>
  <div class="lonchera">${CATS.map(c=>`<div class="slot" style="background:${c.c}"><span class="em">${x[c.k]?find(items(c),x[c.k]):'—'}</span>${x[c.k]?esc(x[c.k]):'Sin '+c.t.toLowerCase()}</div>`).join("")}</div>
  <div class="row">${nx>=0?`<button class="pill" style="background:${DC[nx]}" onclick="cur=${nx};lonche(0)">Sigue el ${LD[nx]}</button>`:''}
  <button class="pill" style="background:var(--sky)" onclick="semL()">Ver mi semana</button></div></div>`;
  yay();say("¡Tu lonche del "+d+" está listo!"+(nx>=0?" Ahora vamos con el "+LD[nx]:""));
}
function rnd(c){const o=paraIsa(c.k,items(c)).filter(x=>!premio(x));return o.length?o[Math.floor(Math.random()*o.length)][0]:null}
function sorpSem(){LD.forEach(d=>{L[d]={};CATS.forEach(c=>{const v=rnd(c);if(v)L[d][c.k]=v})});guardaL();semL();document.getElementById("dl").classList.add("spin");yay();say("¡Sorpresa! Ya quedaron tus lonches de toda la semana")}

/* ---------- Desayunos y cenas ---------- */
const lst=m=>(m=="des"?DES:CEN).map(conFoto);
function semana(m){
  const list=lst(m),w=W[m];
  app.innerHTML=hdr(m=="des"?"Desayunos":"Cenas")+`<div class="days" id="dl">${D.map((d,j)=>{const off=m=="cena"&&!NOCHES.includes(d);
    return `<button class="day${off?' off':''}" onclick="${off?"say('Esta noche escogen papá y mamá')":`say('${d}');elige('${m}',${j})`}"><span class="dn" style="background:${DC[j]}">${d.slice(0,2)}</span><span class="em">${w[d]?find(list,w[d]):(off?'·':'❔')}</span><span class="tx" style="flex:1">${d}<small>${esc(w[d]||(off?'Escogen papá y mamá':'Toca para escoger'))}</small></span>${m=="cena"&&!off?'<span class="star">★</span>':''}</button>`}).join("")}</div>`;
}
// pp=1: lo escogen los papás (ven todo lo que hay, sin voz)
function elige(m,j,pp){
  const av=pp?lst(m).filter(ok):paraIsa(m,lst(m)),d=D[j],w=W[m];
  app.innerHTML=hdr(`<span style="color:${DC[j]}">${d}</span>`,pp?"cenasPapas()":`semana('${m}')`)+`<div class="ask">${m=="des"?"¿Qué desayunamos?":"¿Qué cenamos?"}</div>
  ${av.length?`<div class="grid">${av.map(([n,e])=>`<div class="card ${w[d]==n?'sel':''}" style="${w[d]==n?'border-color:'+DC[j]:''}" onclick="setDia('${m}',${j},'${js(n)}',this,${pp?1:0})"><span class="em">${e}</span><span class="nm">${esc(n)}</span></div>`).join("")}</div>`:nada()+`</div>`}`;
  if(!pp)say(av.length?(m=="des"?"¿Qué desayunamos el "+d+"?":"¿Qué cenamos el "+d+"?"):"No hay nada en casa para esto");
  window.scrollTo(0,0);
}
function setDia(m,j,n,el,pp){W[m][D[j]]=n;guarda(m);if(!pp)say(n);el.classList.add("sel");el.style.borderColor=DC[j];setTimeout(()=>pp?cenasPapas():semana(m),pp?250:650)}
function guarda(m){sv(m=="des"?"isaD2":"isaC2",W[m])}
// Desayunos: los 7 días entre lo preseleccionado. Cenas: solo las noches de papás, entre todo lo que hay.
function rifa(m){
  const av=(m=="des"?paraIsa("des",lst("des")):lst("cena").filter(ok)).filter(x=>!premio(x));
  if(!av.length){toast("No hay nada en la despensa para esto");return}
  const dias=m=="des"?D:D.filter(d=>!NOCHES.includes(d));
  let p=[];while(p.length<dias.length)p=p.concat([...av].sort(()=>Math.random()-.5));
  dias.forEach((d,i)=>W[m][d]=p[i][0]);guarda(m);yay();toast(m=="des"?"Listo, desayunos rifados":"Listo, cenas de papás rifadas")}
home();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
